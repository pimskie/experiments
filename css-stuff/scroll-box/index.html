<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll box</title>
    <link
      rel="stylesheet"
      href="//unpkg.com/open-props@1.7.16/open-props.min.css"
    />
    <link
      rel="stylesheet"
      href="//unpkg.com/open-props@1.7.16/normalize.min.css"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="container">
      <div class="box-container">
        <div class="box">
          <div class="side is-bottom">
            <div class="side is-front is-vertical">
              <div class="side is-horizontal"></div>
              <div class="side is-horizontal"></div>

              <div class="side is-top is-vertical">
                <div class="side is-back is-vertical"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
