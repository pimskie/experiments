<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch card</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://unpkg.com/open-props@1.7.23/open-props.min.css">
    <link rel="stylesheet" href="https://unpkg.com/open-props@1.7.23/normalize.min.css">
</head>
<body>
    <div class="container">
        <div class="card-grid">
            <div class="scratch-card-container">
                <div class="card">
                    <canvas class="canvas jjjjs-scratch-canvas" ></canvas>
                    <h2 class="card__title">Webdeveloper</h2>
                    <div class="card__image">
                        <img src="https://placehold.net/3-800x600.png" alt="" />
                    </div>
                </div>
            </div>

            <div class="scratch-card-container">
                <div class="card">
                    <canvas class="canvas js-scratch-canvas" ></canvas>
                    <h2 class="card__title">Junior SAFe Agile Coach in het middenkader</h2>
                    <a class="card__image" href="https://www.google.com" target="_blank">
                        <img src="https://placehold.net/4-800x600.png" alt="" />
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js" type="module"></script>
</body>
</html>
